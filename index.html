<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Battle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0b0a14;--bg1:#1a1733;--card:#15132a;--gl:#1f1c3d;--tx:#f4f2ff;--mu:#a5a2c8;--bd:rgba(255,255,255,.09);--a:#2ee6c5;--b:#ff5fa2;--lime:#c8ff3d;--ok:#c8ff3d}
body.day{--bg:#f3f0ff;--bg1:#fff;--card:#fff;--gl:#efeaff;--tx:#1b1535;--mu:#6b6590;--bd:rgba(40,25,90,.12);--a:#00a58a;--b:#e6307f;--lime:#b6f02a;--ok:#9fe01a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Sora,system-ui,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;background:radial-gradient(600px 420px at 10% 0,rgba(124,92,255,.38),transparent),radial-gradient(520px 420px at 95% 25%,rgba(255,95,162,.24),transparent),radial-gradient(520px 420px at 50% 100%,rgba(46,230,197,.2),transparent);animation:aur 16s ease-in-out infinite alternate}
body.day:before{opacity:.5}@keyframes aur{to{transform:scale(1.12) translate(-2%,2%)}}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}.stars{position:absolute;width:2px;height:2px;border-radius:50%;animation:tw 4s infinite alternate}
.moon{position:absolute;top:8vh;right:8vw;width:46px;height:46px;border-radius:50%;box-shadow:0 0 60px 14px rgba(200,210,255,.2),inset -11px 0 0 #dfe6ff}
.sun{position:absolute;top:5vh;right:8vw;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff6c2,#ffd25e 60%,transparent 72%);box-shadow:0 0 80px 24px rgba(255,210,94,.45)}
.cl{position:absolute;width:140px;height:38px;border-radius:38px;background:rgba(255,255,255,.7);filter:blur(2px);animation:dr 90s linear infinite}
body:not(.day) .sun,body:not(.day) .cl{display:none}body.day .stars,body.day .moon{display:none}
@keyframes tw{to{opacity:.3}}@keyframes dr{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:14px 14px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1}.sub{color:var(--mu);margin-top:4px;font-size:13px}
.clock{color:var(--mu);font-size:12px;background:var(--card);border:1px solid var(--bd);padding:6px 12px;border-radius:99px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0;position:sticky;top:8px;z-index:6;padding:5px;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}
nav button{flex:1;background:transparent;border:0;border-radius:13px;padding:9px 10px;cursor:pointer;font-weight:600;color:var(--mu);transition:.2s}nav button:hover{color:var(--tx)}nav button.on{background:var(--lime);color:#10130a}
button,input,select{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.btn{background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:9px 14px;cursor:pointer;font-weight:600;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn.pri{background:var(--lime);color:#10130a;border-color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px;box-shadow:0 16px 36px -22px rgba(0,0,0,.7)}
main>.card,main>.g2,main>.row{margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
.pc{position:relative;overflow:hidden;transition:transform .2s}.pc:hover{transform:translateY(-3px)}.pc:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--a)}.pc.p1:before{background:var(--b)}
.pc h2{margin:6px 0 2px;font-size:22px}.pc.p0 h2{color:var(--a)}.pc.p1 h2{color:var(--b)}
.ring{width:104px;height:104px;display:block;margin:4px auto}.rb{fill:none;stroke:var(--gl);stroke-width:10}.rf{fill:none;stroke:var(--a);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .8s}.p1 .rf{stroke:var(--b)}.ring text{fill:var(--tx);font-size:26px;font-weight:800;text-anchor:middle}
.bar{height:10px;border-radius:9px;background:var(--gl);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--lime));transition:width .8s}
.st{background:var(--gl);border-radius:14px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mu)}.st b{display:block;font-size:16px;color:var(--tx)}
.win{text-align:center;font-size:17px;font-weight:700;background:linear-gradient(120deg,var(--card),var(--gl))}
.dq{text-align:center;font-size:16px;font-weight:600}.dq small{display:block;color:var(--mu);font-weight:400;font-size:11px;margin-top:3px}
.tug{height:12px;border-radius:9px;background:var(--b);overflow:hidden;margin-top:10px}.tug i{display:block;height:100%;background:var(--a);transition:width .8s}
.hb{display:flex;width:100%;align-items:center;gap:10px;margin:6px 0;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);cursor:pointer;text-align:left;min-height:50px;transition:.15s;color:var(--tx)}
.hb:hover:not(:disabled){transform:translateY(-2px);border-color:var(--a)}.hb:disabled{opacity:.75;cursor:default}.hb.done{background:var(--lime);color:#10130a;border-color:transparent}.hb.done .ck{animation:pop .35s}
.hb span.x{margin-left:auto;font-weight:700}.ck{font-size:20px}@keyframes pop{50%{transform:scale(1.5)}}
table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:center;border-bottom:1px solid var(--bd)}td:first-child{text-align:left;color:var(--mu)}.lead{font-weight:800;color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}input,select{background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:9px;min-width:0}
.hn{flex:1 1 140px}.pt{width:70px}.mu{color:var(--mu)}.bd{font-size:22px}.chart{width:100%;height:auto}.chart text{fill:var(--mu);font-size:11px;text-anchor:middle;font-family:Sora}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--lime);color:#10130a;font-weight:600;padding:12px 20px;border-radius:16px;z-index:20;max-width:90vw;text-align:center;transition:transform .4s}.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:30}.modal div{background:var(--bg1);color:var(--tx);padding:28px 38px;border-radius:26px;text-align:center;animation:pop .5s}
.cf{position:fixed;top:-10px;width:9px;height:14px;z-index:31;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.fx{position:fixed;z-index:12;font-weight:800;font-size:20px;color:var(--ok);pointer-events:none;animation:up 1s forwards}@keyframes up{to{transform:translateY(-70px);opacity:0}}
.trophy{display:block;font-size:90px;animation:pop .8s,jump 1.2s .8s infinite}@keyframes jump{50%{transform:translateY(-14px)}}
#pets{position:fixed;inset:0;pointer-events:none;z-index:8}.rp{position:absolute;left:0;top:0;width:62px;height:62px;pointer-events:auto;cursor:pointer;will-change:transform}
.rs{width:62px;height:62px}.rs svg{width:100%;height:100%;filter:drop-shadow(0 6px 5px rgba(0,0,0,.35))}
.rp.walk .rs svg{animation:step .38s ease-in-out infinite}.rp.happy .rs svg{animation:jump .6s infinite}@keyframes step{50%{transform:translateY(-6px) rotate(-5deg)}}
.rb2{position:absolute;bottom:68px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:#fff;color:#1b1535;font:600 12px Sora,sans-serif;padding:7px 11px;border-radius:12px;transition:.25s;pointer-events:none;width:max-content;max-width:190px;box-shadow:0 8px 20px rgba(0,0,0,.3)}.rb2.on{opacity:1;transform:translateX(-50%) scale(1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* V10 PREMIUM LIVING WORLD */
:root{--bg:#0d1117;--bg1:#151b22;--card:rgba(24,30,38,.76);--gl:rgba(255,255,255,.055);--tx:#f4f1e8;--mu:#a9adb4;--bd:rgba(255,255,255,.10);--a:#8fb7a5;--b:#c89b55;--lime:#c8aa67;--ok:#9fc3ae;--shadow:0 28px 70px rgba(0,0,0,.28);--glass:rgba(255,255,255,.055);--ground:rgba(80,100,91,.20)}
body.day{--bg:#e8eee9;--bg1:#f6f3ec;--card:rgba(250,249,245,.72);--gl:rgba(44,57,51,.055);--tx:#1e2724;--mu:#6f7773;--bd:rgba(39,51,46,.12);--a:#5c8875;--b:#ad7d39;--lime:#c29b4f;--ok:#5b896f;--shadow:0 28px 70px rgba(52,65,59,.14);--glass:rgba(255,255,255,.50);--ground:rgba(93,125,108,.16)}
body{background:radial-gradient(900px 520px at 8% -8%,rgba(125,151,139,.16),transparent 70%),radial-gradient(850px 600px at 100% 20%,rgba(194,155,79,.09),transparent 68%),linear-gradient(180deg,var(--bg1),var(--bg));transition:background .8s ease,color .5s ease}
body:before{background:radial-gradient(500px 300px at 20% 10%,rgba(255,255,255,.08),transparent 70%),radial-gradient(600px 380px at 82% 24%,rgba(201,166,100,.07),transparent 70%);opacity:.9}
body:not(.day):before{background:radial-gradient(520px 320px at 20% 5%,rgba(105,139,126,.10),transparent 70%),radial-gradient(600px 400px at 84% 20%,rgba(188,151,88,.06),transparent 70%)}

.cl{width:170px;height:36px;background:rgba(255,255,255,.18);filter:blur(8px);opacity:.65}
body:not(.day) .cl{opacity:.035}
.wind-layer{position:absolute;inset:0;overflow:hidden}.wind{position:absolute;width:100px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);border-radius:99px;opacity:0;animation:windMove linear infinite}
body.day .wind{background:linear-gradient(90deg,transparent,rgba(73,101,89,.16),transparent)}
@keyframes windMove{0%{transform:translateX(-140px);opacity:0}12%{opacity:.35}70%{opacity:.18}100%{transform:translateX(110vw);opacity:0}}
.landscape{position:absolute;inset:auto 0 0;height:235px;pointer-events:none}.horizon{position:absolute;left:-5%;right:-5%;bottom:0;height:125px;background:radial-gradient(ellipse at 18% 20%,rgba(105,137,120,.20),transparent 44%),radial-gradient(ellipse at 75% 0%,rgba(113,142,125,.16),transparent 46%),linear-gradient(180deg,transparent 0 20%,var(--ground) 21%,rgba(51,75,65,.12) 100%);border-radius:50% 50% 0 0/35% 35% 0 0;transform:scaleX(1.08)}
body:not(.day) .horizon{background:radial-gradient(ellipse at 18% 20%,rgba(105,137,120,.11),transparent 44%),radial-gradient(ellipse at 75% 0%,rgba(113,142,125,.08),transparent 46%),linear-gradient(180deg,transparent 0 20%,rgba(60,82,72,.18) 21%,rgba(20,28,26,.40) 100%)}
.tree{position:absolute;bottom:22px;width:115px;height:190px;transform-origin:bottom center;filter:drop-shadow(0 18px 22px rgba(0,0,0,.12));pointer-events:auto;cursor:pointer;transition:transform .4s ease,filter .4s ease}
.tree:hover{transform:translateY(-2px) scale(1.015);filter:drop-shadow(0 20px 25px rgba(0,0,0,.18))}
.tree.t1{left:3vw;transform:scale(.86)}.tree.t2{right:4vw;transform:scale(1.08)}.tree.t3{left:27%;bottom:12px;transform:scale(.58);opacity:.60}.tree.t4{right:28%;bottom:10px;transform:scale(.66);opacity:.50}
.trunk{position:absolute;bottom:0;left:50%;width:16px;height:112px;transform:translateX(-50%);border-radius:12px 12px 6px 6px;background:linear-gradient(90deg,#55493e,#806d58 46%,#4a3f36);box-shadow:inset 3px 0 rgba(255,255,255,.08),inset -4px 0 rgba(0,0,0,.18)}
.branch{position:absolute;height:9px;border-radius:99px;background:#5b4d40;transform-origin:left center}.branch.b1{left:50%;top:92px;width:54px;transform:rotate(-34deg)}.branch.b2{left:50%;top:76px;width:49px;transform:rotate(29deg)}.branch.b3{left:48%;top:61px;width:38px;transform:rotate(-24deg)}
.canopy{position:absolute;width:68px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.13),transparent 27%),radial-gradient(circle at 52% 55%,#708f7d 0 38%,#567666 66%,#3f5c50 100%);box-shadow:0 14px 26px rgba(0,0,0,.16)}
.canopy.c1{left:3px;top:25px}.canopy.c2{left:43px;top:13px}.canopy.c3{left:27px;top:56px}
body.day .canopy{filter:saturate(.78) brightness(1.03)}body:not(.day) .canopy{filter:saturate(.65) brightness(.62)}
.bird{position:absolute;width:30px;height:18px;z-index:4;pointer-events:none;opacity:.72}.bird .wing{position:absolute;top:6px;width:14px;height:7px;border-top:2px solid currentColor;border-radius:70% 70% 0 0}.bird .w1{left:0;transform:rotate(10deg)}.bird .w2{right:0;transform:rotate(-10deg)}.bird.fly{animation:birdFly var(--dur,24s) linear infinite}.bird.perch{animation:birdPerch 1s ease-in-out infinite alternate}
@keyframes birdFly{0%{transform:translate3d(-8vw,var(--y),0) scale(var(--s,1));opacity:0}8%{opacity:.70}45%{transform:translate3d(45vw,calc(var(--y) - 18px),0) scale(var(--s,1))}78%{transform:translate3d(82vw,calc(var(--y) + 10px),0) scale(var(--s,1))}100%{transform:translate3d(112vw,calc(var(--y) - 5px),0) scale(var(--s,1));opacity:0}}
@keyframes birdPerch{to{transform:translateY(-2px) rotate(-2deg)}}
.leaf{position:absolute;width:8px;height:13px;border-radius:70% 20% 70% 20%;background:#b99659;opacity:0;pointer-events:none;z-index:5;animation:leafFall var(--dur,9s) linear infinite}
body.day .leaf{background:#a67e43}body:not(.day) .leaf{background:#7d6945;opacity:.45}
@keyframes leafFall{0%{transform:translate3d(var(--x),-30px,0) rotate(0);opacity:0}12%{opacity:.58}38%{transform:translate3d(calc(var(--x) + 55px),35vh,0) rotate(170deg)}65%{transform:translate3d(calc(var(--x) - 25px),68vh,0) rotate(290deg)}100%{transform:translate3d(calc(var(--x) + 85px),105vh,0) rotate(510deg);opacity:0}}
.tree-ripple{position:absolute;width:34px;height:34px;border:1px solid rgba(214,187,126,.45);border-radius:50%;pointer-events:none;animation:ripple .9s ease-out forwards;z-index:9}

/* ---------- cinematic ambient scene ---------- */
#sky{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
#sky:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,transparent 0 48%,rgba(34,58,48,.04) 68%,rgba(12,20,17,.20) 100%);
  pointer-events:none;
}
body.day #sky:before{
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 48%,rgba(74,105,89,.10) 100%);
}

/* atmospheric glass orbs */
.ambient-orb{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.10);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.025) 48%,transparent 72%);
  box-shadow:inset 0 0 30px rgba(255,255,255,.035),0 25px 80px rgba(0,0,0,.08);
  filter:blur(.2px);
  animation:orbFloat var(--d) ease-in-out infinite alternate;
}
body.day .ambient-orb{border-color:rgba(55,76,65,.09);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.65),rgba(255,255,255,.08) 50%,transparent 72%)}
@keyframes orbFloat{to{transform:translate3d(var(--x),var(--y),0) scale(1.04)}}

/* subtle grain gives the surface a designed, tactile feel */
#sky:after{

const rows=[['Completion today',x=>r1(day(x,d).pct)+'%',x=>day(x,d).pct],['Lifetime XP',xpT,xpT],['Perfect days',x=>ser(x).filter(y=>y.perf).length,x=>ser(x).filter(y=>y.perf).length],['Current streak',x=>stk(x).c,x=>stk(x).c],['Best streak',x=>stk(x).b,x=>stk(x).b],['Week XP',x=>per(x,mon(T()),T()).xp,x=>per(x,mon(T()),T()).xp]];
const lb=p1?`<div class="card" style="margin-top:14px"><b>🏆 Leaderboard</b><table><tr><th></th><th>${esc(p0.name)}</th><th>${esc(p1.name)}</th></tr>${rows.map(([n,f,v])=>{const a=v(p0.id),b=v(p1.id);return`<tr><td>${n}</td><td class="${a>b?'lead':''}">${f(p0.id)}</td><td class="${b>a?'lead':''}">${f(p1.id)}</td></tr>`}).join('')}</table></div>`:'';
const col=(p,i)=>{if(!p)return'';const hs=live(p.id,d),mine=p.id==u,t=day(p.id,d);return`<div class="card"><b>${esc(p.name)}</b> <span class="mu">${t.e}/${t.av} XP</span>${bar(t.pct)}${hs.length?hs.map(h=>`<button class="hb ${LI[h.id+'|'+d]?'done':''}" data-a="tog" data-id="${h.id}" ${mine?'':'disabled'}><span class="ck">${LI[h.id+'|'+d]?'✅':'☐'}</span>${esc(h.habit_name)}<span class="x">+${h.points} XP</span></button>`).join(''):'<p class="mu">No habits yet. Add some in Settings.</p>'}</div>`};
const ch=CH[[...d].reduce((s,c)=>s+c.charCodeAt(0),0)%CH.length];
return`${tick()}${dq()}<div class="win card">TODAY'S LEADER<br>${w}${p1?`<div class="tug"><i style="width:${(()=>{const a=day(p0.id,d).pct,b=day(p1.id,d).pct;return a+b?a/(a+b)*100:50})()}%"></i></div>`:''}</div><div class="g2" style="margin-top:14px">${S.P.map(card).join('')}</div>${lb}${p1?heat():''}
<div class="card" style="margin-top:14px"><b>TODAY'S BONUS</b> <span class="mu">${ch}</span></div>
<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" data-a="prev">← Previous day</button><button class="btn pri" data-a="today">${d==T()?'TODAY':d}</button><button class="btn" data-a="next">Next day →</button></div><div class="g2">${col(p0)}${col(p1)}</div>`}
function analysis(u,r){const n=esc(opp(opp(u).id).name);if(!r.ds.length)return'';const b=r.hp[0],w=r.hp[r.hp.length-1];return`${n} had ${r.avg>=80?'a strong':r.avg>=60?'a solid':'a tough'} period at ${r1(r.avg)}%${b?`, strongest in ${esc(b.name)} (${r1(b.pct)}%)`:''}${w&&w!=b?`, weakest in ${esc(w.name)} (${r1(w.pct)}%)`:''}.`}
function pblock(p,r){return`<div class="card"><h3>${esc(p.name)}</h3><div class="g3"><div class="st"><b>${r1(r.avg)}%</b>avg</div><div class="st"><b>${r.xp}</b>XP</div><div class="st"><b>${r.perf}</b>perfect</div><div class="st"><b>${r.best}</b>best streak</div><div class="st"><b>${r.wins}</b>daily wins</div><div class="st"><b>${r.done}</b>done</div></div>
<div style="margin-top:10px">${r.hp.map(h=>`<div class="row" style="margin:3px 0"><span style="flex:1">${esc(h.name)}</span><b>${r1(h.pct)}%</b></div>${bar(h.pct)}`).join('')||'<span class="mu">No data</span>'}</div></div>`}
function report(f,t,title,labels,buckets,nav){const[p0,p1]=S.P;if(!p1)return'<div class="card">Waiting for the second player.</div>';const a=per(p0.id,f,t),b=per(p1.id,f,t);
const ser0=buckets.map(([x,y])=>per(p0.id,x,y).avg),ser1=buckets.map(([x,y])=>per(p1.id,x,y).avg);
const ch=r1(a.avg)==r1(b.avg)?'🤝 Draw':'🏆 '+esc((a.avg>b.avg?p0:p1).name);
return`<div class="row" style="justify-content:center"><button class="btn" data-a="${nav}" data-n="-1">←</button><b>${title}</b><button class="btn" data-a="${nav}" data-n="1">→</button><button class="btn" data-a="print">🖨 Print / PDF</button></div>
<div class="g2">${pblock(p0,a)}${pblock(p1,b)}</div><div class="card win" style="margin-top:14px">${nav=='wk'?'WEEKLY':'MONTHLY'} CHAMPION: ${ch}</div>
<div class="card">${chart(labels,ser0,ser1)}<div class="mu" style="text-align:center;font-size:12px">${esc(p0.name)} (blue) vs ${esc(p1.name)} (orange), completion %</div><p>${analysis(p1.id,a)} ${analysis(p0.id,b)}</p></div>`}
function weekly(){const s=add(mon(T()),7*S.wk),e=add(s,6),dt=x=>new Date(x+'T12:00').toLocaleDateString('en',{month:'short',day:'numeric'});
return report(s,e,`${dt(s)} – ${dt(e)}`,['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],[0,1,2,3,4,5,6].map(i=>[add(s,i),add(s,i)]),'wk')}
function monthly(){const n=new Date(),f0=new Date(n.getFullYear(),n.getMonth()+S.mo,1),f=fmt(f0),e=fmt(new Date(f0.getFullYear(),f0.getMonth()+1,0)),y=f.slice(0,8);
return report(f,e,f0.toLocaleDateString('en',{month:'long',year:'numeric'}),['Week 1','Week 2','Week 3','Week 4'],[[y+'01',y+'07'],[y+'08',y+'14'],[y+'15',y+'21'],[y+'22',e]],'mo')}
function alltime(){const[p0,p1]=S.P;if(!p1)return'<div class="card">Waiting for the second player.</div>';const f=S.H.map(h=>h.c).sort()[0]||T(),a=per(p0.id,f,T()),b=per(p1.id,f,T());
const L=(p,r)=>{const x=xpT(p.id),l=lv(x);return`<div class="card"><h3>${esc(p.name)}</h3><div class="g3"><div class="st"><b>${x}</b>total XP</div><div class="st"><b>Lv ${l.l}</b>level</div><div class="st"><b>${r.done}</b>habits done</div><div class="st"><b>${r.perf}</b>perfect days</div><div class="st"><b>${r.best}</b>longest streak</div><div class="st"><b>${r1(r.avg)}%</b>avg</div></div></div>`};
return`<div class="g2">${L(p0,a)}${L(p1,b)}</div><div class="card win" style="margin-top:14px">⚔️ Days won<br>${esc(p0.name)} — ${a.wins} · ${esc(p1.name)} — ${b.wins} · Draws — ${a.ds.filter(x=>x.av>0&&r1(x.pct)==r1(day(p1.id,x.d).pct)).length}</div>`}
function settings(){const u=S.me.id,m=me(),mine=S.H.filter(h=>h.user_id==u),L=mine.filter(h=>h.active&&!h.a),R=mine.filter(h=>!h.active);
return`<div class="card"><b>Profile</b><div class="row"><input class="hn" data-c="pname" value="${esc(m.name)}" maxlength="30" aria-label="Name"><label>Daily target % <input class="pt" type="number" min="1" max="100" data-c="tgt" value="${m.daily_target}"></label>
<label>Theme <select data-c="theme">${['auto','day','night'].map(x=>`<option ${((localStorage.th||'auto')==x)?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
<div class="card" style="margin-top:14px"><b>My habits</b>${L.map(h=>`<div class="row"><input class="hn" data-f="name" data-id="${h.id}" value="${esc(h.habit_name)}" maxlength="60"><input class="pt" type="number" min="1" max="100" data-f="pts" data-id="${h.id}" value="${h.points}"><button class="btn" data-a="up" data-id="${h.id}">↑</button><button class="btn" data-a="dn" data-id="${h.id}">↓</button><button class="btn pri" data-a="saverow" data-id="${h.id}">Save</button><button class="btn" data-a="retire" data-id="${h.id}">Retire</button></div>`).join('')}
<div class="row"><button class="btn" data-a="pack" data-k="fin">📈 Finance pack</button><button class="btn" data-a="pack" data-k="mkt">📣 Marketing pack</button><label>Companions <select data-c="pets"><option ${localStorage.pets!='off'?'selected':''}>on</option><option ${localStorage.pets=='off'?'selected':''}>off</option></select></label><button class="btn pri" data-a="preall">Add starter pack</button>${PRE.filter(x=>!L.some(h=>h.habit_name==x[0])).map(x=>`<button class="btn" data-a="pre" data-n="${x[0]}" data-p="${x[1]}">+ ${x[0]}</button>`).join('')}</div><div class="row"><input class="hn" id="nn" placeholder="New habit" maxlength="60"><input class="pt" id="np" type="number" value="10" min="1" max="100"><button class="btn pri" data-a="add">Save habit</button></div>
${R.length?'<b>Retired</b>'+R.map(h=>`<div class="row"><span class="hn mu">${esc(h.habit_name)}</span><button class="btn" data-a="restore" data-id="${h.id}">Restore</button></div>`).join(''):''}
<p class="mu" style="font-size:12px">Renames keep old logs under the old name. Point changes and retiring apply from tomorrow, so history never changes.</p></div>
<div class="card row" style="margin-top:14px"><button class="btn pri" data-a="json">Export My Data (JSON)</button><button class="btn" data-a="csv">Download CSV</button><button class="btn" data-a="reset">Reset today</button><button class="btn" data-a="out">Sign out</button></div>`}
function shell(inner){
  const u=S.me?.id, t=u?day(u,S.date):{pct:0,xp:0}, st=u?stk(u):{c:0,b:0};
  const theme=localStorage.th||'auto';
  const h=new Date().getHours();
  const greeting=h<5?'Still up?':h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'Slow down for the night';
  const target=u?tg(u):80;
  const remaining=Math.max(0,r1(target-t.pct));
  const sceneText=t.perf?'You kept every promise today.':t.hit?'Your standard is holding. Keep the rhythm.':'One deliberate action can change the shape of this day.';
  return`
  <header class="top">
    <div>
      <h1>HABIT BATTLE</h1>
      <div class="sub">Two people. Different goals. One shared standard.</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="clock" id="clk"></div>
      <div class="theme-switcher" aria-label="Theme">
        <button data-theme="auto" class="${theme==='auto'?'active':''}" title="Automatic theme">Auto</button>
        <button data-theme="day" class="${theme==='day'?'active':''}" title="Light mode">Light</button>
        <button data-theme="night" class="${theme==='night'?'active':''}" title="Dark mode">Dark</button>
      </div>
    </div>
  </header>

  <nav>${[['home','Today'],['weekly','Weekly'],['monthly','Monthly'],['all','All time'],['set','Settings']].map(([k,n])=>`<button class="${S.page==k?'on':''}" data-a="pg" data-p="${k}">${n}</button>`).join('')}</nav>

  <section class="hero">
    <div class="hero-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--a)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 60 60)" style="stroke-dasharray:${326.7*Math.min(100,t.pct)/100} 326.7;transition:stroke-dasharray .9s"/><text x="60" y="66" text-anchor="middle" fill="var(--tx)" font-size="24" font-weight="800">${r1(t.pct)}%</text></svg><small>Today · target ${target}%</small></div><div class="hero-kicker"><span class="live-dot"></span>PRIVATE LIVING DASHBOARD · ${esc(greeting)}</div>
    <div class="hero-title">${esc(sceneText)}</div>
    <div class="hero-copy">A quiet place to build consistency — your progress stays visible, your standards stay yours, and the world around the dashboard keeps moving.</div>
    <div class="hero-meta">
      <span class="hero-chip"><strong>${r1(t.pct)}%</strong> completed today</span>
      <span class="hero-chip"><strong>${t.xp}</strong> XP earned today</span>
      <span class="hero-chip"><strong>${st.c} days</strong> current streak</span>
      <span class="hero-chip">${remaining?`<strong>${remaining}%</strong> to target`:'<strong>Target reached</strong>'}</span>
    </div>
  </section>

  <section class="rhythm">
    <div class="rhythm-card">
      <div class="rhythm-label">Today's rhythm</div>
      <div class="rhythm-value">${t.perf?'Perfect day':t.hit?'On target':'In progress'}</div>
      <div class="rhythm-note">${t.av?`${LC[u+'|'+S.date]||0} of ${live(u,S.date).length} habits completed`:'Add your first habit to begin'}</div>
      <div class="rhythm-line"><i style="width:${Math.min(100,t.pct)}%"></i></div>
    </div>
    <div class="rhythm-card">
      <div class="rhythm-label">Next milestone</div>
      <div class="rhythm-value">${st.c<3?'3 days':st.c<7?'7 days':st.c<14?'14 days':'30 days'}</div>
      <div class="rhythm-note">${st.c?`${Math.max(0,(st.c<3?3:st.c<7?7:st.c<14?14:30)-st.c)} days away`:'Start your streak today'}</div>
    </div>
    <div class="rhythm-card">
      <div class="rhythm-label">Best streak</div>
      <div class="rhythm-value">${st.b} days</div>
      <div class="rhythm-note">Your personal benchmark</div>
    </div>
  </section>

  ${inner}`;
}
function render(){$('#app').innerHTML=shell({home,weekly,monthly,all:alltime,set:settings}[S.page]());clock();roam();petsRefresh()}
function clock(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleString('en',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
function theme(){const m=localStorage.th||'auto',h=new Date().getHours(),night=m=='night'||(m=='auto'&&(h<6||h>=18));document.body.classList.toggle('day',!night);document.body.classList.toggle('nopets',localStorage.pets=='off');document.documentElement.dataset.theme=m}
function sky(){
  let s='';
  for(let i=0;i<70;i++)s+=`${Math.random()*100}vw ${Math.random()*100}vh #fff,`;

  const wind=Array.from({length:12},(_,i)=>
    `<i class="wind" style="top:${15+i*5.8}vh;animation-duration:${19+i*2.1}s;animation-delay:-${i*2.7}s"></i>`
  ).join('');

  const leaves=Array.from({length:24},(_,i)=>
    `<i class="leaf" style="--x:${(Math.random()*100).toFixed(1)}vw;--dur:${(8+Math.random()*9).toFixed(1)}s;animation-delay:-${(Math.random()*14).toFixed(1)}s"></i>`
  ).join('');

  const motes=Array.from({length:34},(_,i)=>
    `<i class="mote" style="left:${(Math.random()*100).toFixed(1)}%;top:${(55+Math.random()*45).toFixed(1)}%;--dx:${(-80+Math.random()*160).toFixed(0)}px;--d:${(12+Math.random()*18).toFixed(1)}s;animation-delay:-${(Math.random()*18).toFixed(1)}s"></i>`
  ).join('');

  const orbs=`
    <i class="ambient-orb" style="width:130px;height:130px;left:7%;top:22%;--x:18px;--y:-12px;--d:8s"></i>
    <i class="ambient-orb" style="width:80px;height:80px;right:17%;top:34%;--x:-20px;--y:15px;--d:10s"></i>
    <i class="ambient-orb" style="width:55px;height:55px;left:39%;top:18%;--x:12px;--y:20px;--d:7s"></i>`;

  const birds=Array.from({length:7},(_,i)=>
    `<div class="bird fly" style="--y:${10+i*8}vh;--dur:${24+i*4}s;--s:${.58+i*.08};animation-delay:-${i*5}s;color:${i%2?'#5a665f':'#424e48'}"><i class="wing w1"></i><i class="wing w2"></i></div>`
  ).join('');

  const perched=`
    <div class="bird perch" style="left:9vw;bottom:246px;color:#46534c"><i class="wing w1"></i><i class="wing w2"></i></div>
    <div class="bird perch" style="right:11vw;bottom:257px;color:#46534c;transform:scale(.8)"><i class="wing w1"></i><i class="wing w2"></i></div>`;

  const botanicals=`
    <div class="botanical left"><i class="stem"></i><i class="leaflet l1"></i><i class="leaflet l2"></i><i class="leaflet l3"></i><i class="leaflet l4"></i><i class="leaflet l5"></i></div>
    <div class="botanical right"><i class="stem"></i><i class="leaflet l1"></i><i class="leaflet l2"></i><i class="leaflet l3"></i><i class="leaflet l4"></i><i class="leaflet l5"></i></div>`;

  const trees=`
    <div class="tree t1" data-tree="1"><i class="trunk"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="canopy c1"></i><i class="canopy c2"></i><i class="canopy c3"></i></div>
    <div class="tree t2" data-tree="2"><i class="trunk"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="canopy c1"></i><i class="canopy c2"></i><i class="canopy c3"></i></div>`;

  $('#sky').innerHTML=`
    <div class="stars" style="box-shadow:${s.slice(0,-1)}"></div>
    <div class="moon"></div><div class="sun"></div>
    <div class="cl" style="top:13vh"></div>
    <div class="cl" style="top:29vh;animation-delay:-46s"></div>
    ${orbs}${motes}
    <div class="wind-layer">${wind}</div>
    ${birds}${perched}${leaves}
    <div class="lux-scene">
      <div class="scene-glow"></div>
      <div class="hill h1"></div><div class="hill h2"></div>
      ${botanicals}${trees}
      <div class="grass"></div>
    </div>`;

  document.querySelectorAll('[data-tree]').forEach(t=>t.addEventListener('click',treeInteract));
}
function treeInteract(e){
const t=e.currentTarget,r=t.getBoundingClientRect(),x=r.left+r.width*.5,y=r.top+r.height*.32;
const q=document.createElement('i');q.className='tree-ripple';q.style.left=x-17+'px';q.style.top=y-17+'px';document.body.appendChild(q);setTimeout(()=>q.remove(),950);
for(let i=0;i<2;i++){const l=document.createElement('i');l.className='leaf';l.style.left=(x+(Math.random()*28-14))+'px';l.style.top=(y+20)+'px';l.style.setProperty('--x',(x+(Math.random()*24-12))+'px');l.style.setProperty('--dur',(2.8+Math.random()*1.5)+'s');l.style.animation='leafFall '+(2.8+Math.random()*1.5)+'s linear forwards';document.body.appendChild(l);setTimeout(()=>l.remove(),4600)}
toast('A soft breeze moves through the garden.',2200)
}

function authView(){$('#app').innerHTML=`<h1>HABIT BATTLE</h1><div class="sub">Two people. Different goals. One shared standard.</div><div class="card" style="max-width:380px;margin:30px auto"><div class="row"><input class="hn" id="nm" placeholder="Your name (Utkarsh / Kalash)" maxlength="30"></div><div class="row"><input class="hn" id="pw" type="password" placeholder="Password (min 6 characters)"></div><div class="row"><button class="btn pri" data-a="signin">Enter battle</button><button class="btn" data-a="signup">First time? Join</button></div></div>`}
async function boot(){if(SUPABASE_URL.startsWith('PASTE')){$('#app').innerHTML='<div class="card" style="margin:40px 0">Setup needed: paste your Supabase URL and anon key at the top of the script in index.html.</div>';return}
sb=sb||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const{data:{session}}=await sb.auth.getSession();if(!session)return authView();S.me=session.user;await load();
if(!S.P.some(p=>p.id==S.me.id)){await sb.from('profiles').insert({id:S.me.id,name:(S.me.user_metadata?.name||S.me.user_metadata?.full_name||'Player').slice(0,30)});await load()}render();weeklyCheck();goLive()}

document.addEventListener('click',e=>{
  const th=e.target.closest('[data-theme]');
  if(th){
    localStorage.th=th.dataset.theme;
    theme();
    render();
    toast(th.dataset.theme==='night'?'Dark mode enabled':th.dataset.theme==='day'?'Light mode enabled':'Automatic theme enabled',1800);
    return;
  }
  if(e.target.closest('button,.hb,.tree,.rp,.btn')){
    const r=e.target.closest('button,.hb,.tree,.rp,.btn').getBoundingClientRect();
    const q=document.createElement('i');q.className='interaction-ring';
    q.style.left=(r.left+r.width/2-9)+'px';q.style.top=(r.top+r.height/2-9)+'px';
    document.body.appendChild(q);setTimeout(()=>q.remove(),800);
  }
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el).catch(er=>toast('Error: '+er.message,9000))});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)chg(el.dataset.c,el)});
theme();sky();let lastT=T();setInterval(()=>{theme();clock();if(T()!=lastT){if(S.date==lastT)S.date=T();lastT=T();if(S.me){C={};render()}}},30000);setInterval(async()=>{if(S.me&&S.page=='home'&&!document.hidden){await load();render()}},30000);boot().catch(er=>toast('Error: '+er.message,9000));
</script></body></html>
