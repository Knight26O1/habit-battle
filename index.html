<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg1:#0b1026;--bg2:#1b1f4b;--tx:#eef0ff;--mu:#9aa0c8;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--a:#7c9cff;--b:#ff9f5a;--ok:#4ade80}
body.day{--bg1:#6ab7ff;--bg2:#d8efff;--tx:#14213d;--mu:#46567a;--gl:rgba(255,255,255,.55);--bd:rgba(255,255,255,.8);--a:#3b5bdb;--b:#e8590c}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Sora,system-ui,sans-serif;color:var(--tx);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden;transition:background 1s}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars{position:absolute;width:2px;height:2px;border-radius:50%;animation:tw 4s infinite alternate}
.moon{position:absolute;top:8vh;right:10vw;width:60px;height:60px;border-radius:50%;box-shadow:0 0 70px 20px rgba(200,210,255,.25),inset -14px 0 0 #dfe6ff;background:transparent}
.sun{position:absolute;top:6vh;left:12vw;width:90px;height:90px;border-radius:50%;background:radial-gradient(#fff6c2,#ffd25e 60%,transparent 72%);box-shadow:0 0 90px 30px rgba(255,210,94,.5)}
.cl{position:absolute;width:160px;height:44px;border-radius:44px;background:rgba(255,255,255,.8);filter:blur(2px);animation:dr 90s linear infinite}
body:not(.day) .sun,body:not(.day) .cl{display:none}body.day .stars,body.day .moon{display:none}
@keyframes tw{to{opacity:.3}}@keyframes dr{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
main{position:relative;z-index:1;max-width:1000px;margin:auto;padding:16px}
h1{margin:0;font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:.02em}
.sub{color:var(--mu);margin:2px 0 8px}.clock{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
button,input,select{font:inherit;color:inherit}
nav button,.btn{background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(12px)}
nav button.on,.btn.pri{background:var(--a);color:#fff;border-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(16px)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.pc h2{margin:0 0 4px}.pc.p0 h2{color:var(--a)}.pc.p1 h2{color:var(--b)}
.ring{width:120px;height:120px;display:block;margin:8px auto}.rb{fill:none;stroke:var(--bd);stroke-width:10}.rf{fill:none;stroke:var(--a);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .8s}
.p1 .rf{stroke:var(--b)}.ring text{fill:var(--tx);font-size:26px;font-weight:800;text-anchor:middle}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--ok));transition:width .8s}
.st{background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}.st b{display:block;font-size:17px;color:var(--tx)}
.win{text-align:center;margin:14px 0;font-size:18px;font-weight:600}
.hb{display:flex;width:100%;align-items:center;gap:10px;margin:6px 0;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);cursor:pointer;text-align:left;min-height:52px;transition:transform .15s,background .3s}
.hb:disabled{opacity:.7;cursor:default}.hb.done{background:rgba(74,222,128,.22);border-color:var(--ok)}.hb.done .ck{animation:pop .35s}
.hb span.x{margin-left:auto;font-weight:600}.ck{font-size:20px}@keyframes pop{50%{transform:scale(1.5)}}
table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:center;border-bottom:1px solid var(--bd)}td:first-child{text-align:left;color:var(--mu)}.lead{font-weight:800;color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--a);color:#fff;padding:14px 22px;border-radius:16px;z-index:9;max-width:90vw;text-align:center;transition:transform .4s}.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10}.modal div{background:var(--bg1);color:#fff;padding:30px 40px;border-radius:24px;text-align:center;animation:pop .5s}
.cf{position:fixed;top:-10px;width:9px;height:14px;z-index:11;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}input,select{background:var(--gl);border:1px solid var(--bd);border-radius:10px;padding:8px;min-width:0}
.hn{flex:1 1 140px}.pt{width:70px}.mu{color:var(--mu)}.bd{font-size:22px}
.chart{width:100%;height:auto}.chart text{fill:var(--mu);font-size:11px;text-anchor:middle;font-family:Sora}
.dq{text-align:center;font-size:17px;font-weight:600;margin-bottom:14px}.dq small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:4px}
.tug{height:14px;border-radius:9px;background:var(--b);overflow:hidden;margin:10px 0 0}.tug i{display:block;height:100%;background:var(--a);transition:width .8s}
.pets{display:flex;align-items:flex-end;justify-content:center;gap:18px;flex-wrap:wrap}.pet{cursor:pointer;text-align:center;width:170px;transition:transform .2s}.pet:hover{transform:scale(1.06)}
.pet svg{width:96px;height:96px}.bub{background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.pet.push svg,.pet.sad svg{animation:bob 2.4s ease-in-out infinite}.pet.happy svg{animation:jump .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}@keyframes jump{50%{transform:translateY(-14px)}}
.fx{position:fixed;z-index:12;font-weight:800;font-size:20px;color:var(--ok);pointer-events:none;animation:up 1s forwards}@keyframes up{to{transform:translateY(-70px);opacity:0}}
.hb:hover:not(:disabled){transform:translateX(4px)}.pc{transition:transform .2s}.pc:hover{transform:translateY(-3px)}
.trophy{display:block;font-size:90px;animation:pop .8s,jump 1.2s .8s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== FRESH V4 GAME UI ===== */
:root{--panel:rgba(255,255,255,.72);--panel2:rgba(255,255,255,.52);--shadow:0 18px 55px rgba(48,55,90,.12);--gold:#f6b73c}
body.day{--bg1:#f8fbff;--bg2:#eaf1ff;--tx:#172033;--mu:#667085;--bd:rgba(32,45,70,.10);--a:#6657f7;--b:#ff7657;--ok:#20bd75;--panel:rgba(255,255,255,.78);--panel2:rgba(255,255,255,.55)}
body:not(.day){--bg1:#070918;--bg2:#11152a;--tx:#f7f8ff;--mu:#aeb6d0;--bd:rgba(255,255,255,.12);--a:#8f80ff;--b:#ff9070;--ok:#45e49a;--panel:rgba(20,25,48,.72);--panel2:rgba(29,35,64,.58);--shadow:0 24px 70px rgba(0,0,0,.32)}
body{background:radial-gradient(circle at 12% 8%,rgba(109,93,252,.16),transparent 26%),radial-gradient(circle at 88% 18%,rgba(255,122,89,.13),transparent 24%),linear-gradient(145deg,var(--bg1),var(--bg2));transition:background .7s,color .4s}
main{max-width:1180px;padding:24px 18px 70px}
h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.045em;line-height:1}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand-mark{display:inline-flex;align-items:center;gap:9px}.brand-dot{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 22px rgba(109,93,252,.45)}
.clock{padding:8px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow);font-size:12px}
nav{padding:7px;background:var(--panel);border:1px solid var(--bd);border-radius:17px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}
nav button,.btn{border-radius:13px;transition:.2s transform,.2s box-shadow}.btn:hover,nav button:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(0,0,0,.08)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(22px);padding:20px}
.pc{position:relative;overflow:hidden}.pc:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--a),var(--b))}.pc.p1:before{background:linear-gradient(90deg,var(--b),var(--gold))}
.g2{gap:18px}.g3{gap:10px}.st{border-radius:15px;background:rgba(255,255,255,.055);padding:10px 7px;border:1px solid var(--bd)}
.hb{border-radius:16px;padding:13px 15px;background:rgba(255,255,255,.045)}.hb:hover:not(:disabled){background:rgba(109,93,252,.09);transform:translateX(5px) scale(1.01)}
.hb.done{background:linear-gradient(90deg,rgba(33,199,122,.18),rgba(33,199,122,.07));box-shadow:0 8px 22px rgba(33,199,122,.08)}
.bar{height:11px;background:rgba(127,127,160,.16)}.bar i{background:linear-gradient(90deg,var(--a),var(--ok));box-shadow:0 0 14px rgba(69,228,154,.25)}.rf{filter:drop-shadow(0 0 5px rgba(143,128,255,.35))}
.dq{font-size:18px;padding:25px}.win{border-radius:22px;background:linear-gradient(135deg,rgba(109,93,252,.12),rgba(255,122,89,.08))}
.pets{min-height:175px;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 100%,rgba(109,93,252,.12),transparent 30%),radial-gradient(circle at 80% 0,rgba(255,122,89,.10),transparent 30%),var(--panel)}
.pets:after{content:"";position:absolute;width:120px;height:24px;right:7%;bottom:16px;border-radius:50%;background:rgba(0,0,0,.08);filter:blur(7px)}
.pet{position:relative;z-index:1}.pet svg{filter:drop-shadow(0 9px 8px rgba(0,0,0,.15))}
.play-zone{display:flex;justify-content:center;gap:28px;align-items:flex-end;min-height:58px;margin-top:-12px;position:relative;z-index:2}
.toy{font-size:36px;cursor:pointer;display:inline-block;filter:drop-shadow(0 7px 6px rgba(0,0,0,.12));transition:.2s}.toy:hover{transform:translateY(-7px) rotate(-7deg) scale(1.12)}
.toy.bounce{animation:toyBounce .55s}@keyframes toyBounce{50%{transform:translateY(-22px) rotate(15deg) scale(1.15)}}
.reward-box{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:15px 17px;border-radius:18px;background:linear-gradient(135deg,rgba(246,183,60,.15),rgba(109,93,252,.10));border:1px solid rgba(246,183,60,.25)}
.reward-box b{color:var(--gold)}.streak-fire{display:inline-flex;align-items:center;gap:5px;font-weight:800}.streak-fire.hot{animation:firePulse 1.4s infinite}
@keyframes firePulse{50%{transform:scale(1.07);filter:drop-shadow(0 0 10px rgba(255,150,50,.45))}}
.badge-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:rgba(246,183,60,.12);border:1px solid rgba(246,183,60,.24);margin:4px 4px 0 0;font-size:12px}
.hero-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.nature-caption{font-size:12px;color:var(--mu);margin-top:10px}.nature-caption::first-letter{font-size:15px}
@media(prefers-reduced-motion:reduce){.bird,.leaf-float,.firefly,.toy,.tree{animation:none!important}}@media(max-width:700px){.topbar{display:block}.clock{display:inline-block;margin-top:12px}.play-zone{gap:18px}.toy{font-size:29px}}

/* ===== LIVING NATURE WORLD ===== */
.sky{overflow:hidden}
.nature-layer{position:absolute;inset:0;pointer-events:none}
.hill{position:absolute;left:-5%;right:-5%;bottom:-8vh;height:30vh;border-radius:50% 50% 0 0/80% 80% 0 0;background:linear-gradient(180deg,rgba(39,87,77,.34),rgba(16,46,43,.20));filter:blur(1px)}
.hill.back{bottom:4vh;height:19vh;opacity:.45;background:linear-gradient(180deg,rgba(78,124,109,.22),rgba(18,52,50,.10))}
.tree{position:absolute;bottom:2vh;width:110px;height:170px;opacity:.8;transform-origin:bottom center}
.tree .trunk{position:absolute;bottom:0;left:48px;width:15px;height:90px;border-radius:10px;background:linear-gradient(90deg,#3b2b29,#765044,#3b2b29)}
.tree .leaf{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#75b99c,#286c59 70%);box-shadow:0 12px 24px rgba(0,0,0,.18)}
.tree .l1{width:72px;height:72px;left:4px;top:32px}.tree .l2{width:86px;height:86px;left:25px;top:0}.tree .l3{width:66px;height:66px;left:48px;top:40px}
.tree.t1{left:-18px;transform:scale(.92)}.tree.t2{right:-20px;transform:scale(1.15)}.tree.t3{left:23%;bottom:-2vh;transform:scale(.62);opacity:.42}
.bird{position:absolute;width:42px;height:22px;animation:birdFly linear infinite}
.bird:before,.bird:after{content:"";position:absolute;top:6px;width:20px;height:9px;border-top:3px solid currentColor;border-radius:50%}
.bird:before{left:0;transform:rotate(15deg)}.bird:after{right:0;transform:rotate(-15deg)}
.b1{top:17%;left:-10%;color:#4c5472;animation-duration:25s}.b2{top:29%;left:-15%;color:#68708c;animation-duration:34s;animation-delay:-11s;transform:scale(.72)}.b3{top:12%;left:-20%;color:#8189a1;animation-duration:43s;animation-delay:-24s;transform:scale(.52)}
@keyframes birdFly{0%{transform:translateX(0) translateY(0) scale(1)}25%{transform:translateX(30vw) translateY(-20px)}50%{transform:translateX(60vw) translateY(18px)}75%{transform:translateX(90vw) translateY(-12px)}100%{transform:translateX(125vw) translateY(0)}}
.leaf-float{position:absolute;font-size:20px;opacity:.58;animation:leafDrift linear infinite}
.leaf-float:nth-child(1){left:10%;top:-5%;animation-duration:16s}.leaf-float:nth-child(2){left:42%;top:-10%;animation-duration:21s;animation-delay:-7s}.leaf-float:nth-child(3){left:74%;top:-8%;animation-duration:18s;animation-delay:-11s}.leaf-float:nth-child(4){left:92%;top:5%;animation-duration:25s;animation-delay:-16s}
@keyframes leafDrift{0%{transform:translate(0,-30px) rotate(0deg)}25%{transform:translate(8vw,25vh) rotate(110deg)}50%{transform:translate(-4vw,52vh) rotate(220deg)}75%{transform:translate(12vw,76vh) rotate(310deg)}100%{transform:translate(-3vw,112vh) rotate(450deg)}}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe89a;box-shadow:0 0 14px 5px rgba(255,232,154,.65);animation:firefly 4s ease-in-out infinite}
.f1{left:17%;top:50%;animation-delay:-1s}.f2{left:65%;top:62%;animation-delay:-2s}.f3{left:82%;top:44%;animation-delay:-3s}.f4{left:38%;top:72%;animation-delay:-.5s}.f5{left:53%;top:37%;animation-delay:-2.5s}
@keyframes firefly{50%{opacity:.18;transform:translateY(-14px) scale(.65)}}
body.day .firefly{display:none}
body.day .hill{background:linear-gradient(180deg,rgba(77,145,107,.28),rgba(41,105,80,.10))}
body:not(.day) .tree{opacity:.64;filter:saturate(.72) brightness(.72)}
body:not(.day) .bird{color:#b9bfd4}
body:not(.day) .cl{opacity:.10}
body:not(.day) .card{box-shadow:0 22px 70px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.04)}
body:not(.day) input,body:not(.day) select{background:rgba(255,255,255,.055);color:var(--tx)}
body:not(.day) input::placeholder{color:#7e87a6}
body.day .card{box-shadow:0 20px 60px rgba(72,91,135,.13)}
body.day .tree{opacity:.48}
.nature-glow{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(101,224,174,.13),transparent 68%);left:20%;bottom:3%;filter:blur(12px)}
/* richer cards */
.card{border-color:rgba(255,255,255,.11)}
.pc{background:linear-gradient(145deg,var(--panel),var(--panel2))}
.pc h2{letter-spacing:-.025em}
.hero-line{position:relative;z-index:2}
.mode-toggle{min-width:88px}.btn:not(.pri){background:rgba(255,255,255,.07)}body.day .btn:not(.pri),body.day nav button{background:rgba(255,255,255,.62);color:var(--tx)}body:not(.day) .btn:not(.pri),body:not(.day) nav button{background:rgba(255,255,255,.055);color:var(--tx)}body:not(.day) nav button.on{color:#fff}

.mission-board{margin-top:16px;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(109,93,252,.10),rgba(33,199,122,.07));border:1px solid var(--bd)}
.mission-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mission-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-size:12px}

/* ===== V7 LIVING WORLD ===== */
.world-object{cursor:pointer;pointer-events:auto}
.tree{cursor:pointer;pointer-events:auto;transition:filter .25s}.tree:hover{filter:brightness(1.15) saturate(1.1)}.tree.rustle{animation:treeRustle .7s ease-in-out}
@keyframes treeRustle{20%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}80%{transform:rotate(-1deg)}}
.bird{cursor:pointer;pointer-events:auto}.bird.flutter{animation:birdFlutter .7s ease-in-out!important}
@keyframes birdFlutter{25%{transform:translateY(-18px) scale(1.12)}65%{transform:translateY(8px) scale(.92)}}

@keyframes petLove{35%{transform:scale(1.12) rotate(-5deg)}70%{transform:scale(1.04) rotate(5deg)}}@keyframes petBark{25%{transform:translateX(-5px) rotate(-3deg)}75%{transform:translateX(5px) rotate(3deg)}}
.heart-pop{position:fixed;z-index:51;pointer-events:none;font-size:24px;animation:heartPop 1.2s ease-out forwards}@keyframes heartPop{to{transform:translateY(-80px) scale(1.35);opacity:0}}
.empty-missions{padding:22px;border:1px dashed var(--bd);border-radius:17px;text-align:center;background:rgba(255,255,255,.025)}
body:not(.day) .card{box-shadow:0 22px 70px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.04)}
@media(prefers-reduced-motion:reduce){.bird,.leaf-float,.firefly,.toy,.tree{animation:none!important}}
@media(max-width:700px){.pet-zone{padding:4px 0;gap:6px}.pet-zone .pet svg{width:100px;height:100px}}

async function boot(){if(SUPABASE_URL.startsWith('PASTE')){$('#app').innerHTML='<div class="card" style="margin:40px 0">Setup needed: paste your Supabase URL and anon key at the top of the script in index.html.</div>';return}
sb=sb||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const{data:{session}}=await sb.auth.getSession();if(!session)return authView();
S.me=session.user;await load();
if(!S.P.some(p=>p.id==S.me.id)){
  await sb.from('profiles').insert({id:S.me.id,name:(S.me.user_metadata?.name||S.me.user_metadata?.full_name||'Player').slice(0,30)});
  await load();
}
await ensureHabits();
await load();
render();weeklyCheck()}
document.addEventListener('click',e=>{
  const toy=e.target.closest('[data-toy]');if(toy)return playToy(toy);
  const tree=e.target.closest('.tree');if(tree)return worldClick('tree',tree);
  const bird=e.target.closest('.bird');if(bird)return worldClick('bird',bird);
  const leaf=e.target.closest('.leaf-float');if(leaf)return worldClick('leaf',leaf);
  const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el).catch(er=>toast('Error: '+er.message,9000))
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)chg(el.dataset.c,el)});
theme();sky();let lastT=T();setInterval(()=>{theme();clock();if(T()!=lastT){if(S.date==lastT)S.date=T();lastT=T();if(S.me){C={};render()}}},30000);setInterval(async()=>{if(S.me&&S.page=='home'&&!document.hidden){await load();render()}},30000);boot().catch(er=>toast('Error: '+er.message,9000));
